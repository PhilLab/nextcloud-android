# can be overriden by ~/.gradle/gradle.properties
NC_TEST_SERVER_BASEURL=http://server
NC_TEST_SERVER_USERNAME=test
NC_TEST_SERVER_PASSWORD=test
android.useAndroidX=true
android.nonTransitiveRClass=true
#android.debug.obsoleteApi=true


# JVM arguments to optimize heap usage, enable heap dump on out-of-memory errors, and set the file encoding
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.dependency.verification.console=verbose
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

org.gradle.workers.max=4

# Needed for local libs
# org.gradle.dependency.verification=off
# systemProp.org.gradle.internal.publish.checksums.insecure=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Consumed by :opencv-minimal:android (see submodules/fairscan/opencv-minimal) to build a
# minimized OpenCV native library from source, instead of depending on the full prebuilt AAR.
# Values must match submodules/fairscan/gradle.properties - keep them in sync when bumping the
# submodule pin or changing which OpenCV modules FairScan's own code actually needs.
supportedABIs=arm64-v8a,armeabi-v7a,x86_64
openCVVersion=4.12.0
openCVSourceSha256=44c106d5bb47efec04e531fd93008b3fcd1d27138985c5baf4eafac0e1ec9e9d
openCVAarSha256=f71846a313388d9da667a59be1e921669fcf792d1ba264b3898253ca789bc3f0
openCVModulesToInclude=imgproc,imgcodecs
